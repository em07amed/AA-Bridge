name: Android CI
# Auto-labels each run in the Actions list instead of a generic "Android
# CI" repeated for every single run: a PR build names itself after the PR
# (number + title), anything else after the branch and short commit.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} @ {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [main, speed-radar-alerts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      # Releases are signed with the private key kept in the repo's Actions
      # secrets (never committed). Without it the release step fails rather
      # than publishing an APK signed with the public debug key.
      - name: Release signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/speed-radar-alerts'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PASSWORD secrets are missing"; exit 1
          fi
          # Pasting on a phone can add spaces or line breaks; the key is 5744 characters.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "keystore secret: ${#CLEAN} characters (expected 5744)"
          printf '%s' "$CLEAN" | base64 -d > app/release.jks
          keytool -list -keystore app/release.jks -storepass "$PASS" -alias drivebridge > /dev/null \
            || { echo "::error::the keystore or its password from the secrets is wrong"; exit 1; }
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=drivebridge\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/speed-radar-alerts'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Name the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/speed-radar-alerts'
        run: |
          cp app/build/outputs/apk/release/app-release.apk AA-Bridge-alerts.apk
          rm -f app/release.jks keystore.properties

      - name: Publish the APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/speed-radar-alerts'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alerts-build-${{ github.run_number }}
          name: Drive Bridge build ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          files: AA-Bridge-alerts.apk
          make_latest: true
