# Builds the offline Egypt roads pack (tools/roadpack/build_pack.py) from the
# Geofabrik OpenStreetMap extract and publishes it on the "roads-egypt" release,
# where the app downloads it on Wi-Fi. Weekly, and whenever the generator changes.
# The release is never marked latest, so the app's update check ignores it.
name: Egypt roads pack

on:
  push:
    branches: [speed-radar-alerts, roads-pack]
    paths:
      - 'tools/roadpack/**'
      - '.github/workflows/roads-pack.yml'
  schedule:
    - cron: '17 2 * * 5'   # Fridays 04:17 Cairo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roads-pack
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          python3 -m venv .venv
          .venv/bin/pip install -q osmium

      - name: Check the generator on the sample map
        run: .venv/bin/python tools/roadpack/build_pack.py tools/roadpack/test/sample.osm /tmp/sample.zip

      - name: Download Egypt from Geofabrik
        run: |
          curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors -o egypt.osm.pbf https://download.geofabrik.de/africa/egypt-latest.osm.pbf
          ls -l egypt.osm.pbf

      - name: Keep only roads and speed cameras
        run: |
          osmium tags-filter egypt.osm.pbf \
            w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,living_street,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
            n/highway=speed_camera n/traffic_calming \
            -o roads.osm.pbf --overwrite
          ls -l roads.osm.pbf

      - name: Build the pack
        run: |
          .venv/bin/python tools/roadpack/build_pack.py roads.osm.pbf egypt-roads.zip
          ls -l egypt-roads.zip

      - name: Describe it
        run: |
          .venv/bin/python - <<'EOF'
          import hashlib, json, os, zipfile
          meta = json.loads(zipfile.ZipFile("egypt-roads.zip").read("meta.json"))
          meta["bytes"] = os.path.getsize("egypt-roads.zip")
          meta["sha256"] = hashlib.sha256(open("egypt-roads.zip", "rb").read()).hexdigest()
          json.dump(meta, open("egypt-roads.json", "w"), ensure_ascii=False)
          print(json.dumps(meta, ensure_ascii=False))
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Offline Egypt roads for Drive Bridge, built $(date -u +%F) from OpenStreetMap (© OpenStreetMap contributors, ODbL; extract by Geofabrik). The app downloads it by itself."
          if gh release view roads-egypt > /dev/null 2>&1; then
            gh release upload roads-egypt egypt-roads.zip egypt-roads.json --clobber
            gh release edit roads-egypt --notes "$NOTES" --latest=false
          else
            gh release create roads-egypt egypt-roads.zip egypt-roads.json \
              --title "Egypt roads pack" --notes "$NOTES" --latest=false --target "$GITHUB_SHA"
          fi
